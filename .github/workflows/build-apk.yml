name: Build Release APK + AAB

on:
  workflow_dispatch:  # manual trigger from GitHub UI
  push:
    branches:
      - main          # auto-build on every push to main
    tags:
      - 'v*'          # also triggers on version tags like v1.0.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Decode keystore, google-services.json, and .env
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > viva_app/android/keystore.jks
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > viva_app/android/app/google-services.json
          printf '%s' "${{ secrets.ENV_FILE }}" | base64 --decode > viva_app/.env

      - name: Flutter pub get
        run: flutter pub get
        working-directory: viva_app

      - name: Build release APK
        working-directory: viva_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/viva_app/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build release AAB (for Indus Appstore / Play Store)
        working-directory: viva_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/viva_app/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify artifacts exist
        run: |
          APK=viva_app/build/app/outputs/flutter-apk/app-release.apk
          AAB=viva_app/build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then echo "❌ APK not found"; exit 1; fi
          if [ ! -f "$AAB" ]; then echo "❌ AAB not found"; exit 1; fi
          echo "✅ APK: $(du -sh $APK | cut -f1)"
          echo "✅ AAB: $(du -sh $AAB | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viva-release-apk
          path: viva_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB (Indus Appstore / Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: viva-release-aab
          path: viva_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
